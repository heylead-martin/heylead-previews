<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Logging out…</title>
<script src="/auth-config.js"></script>
<script>
(function () {
  var cfg = window.PREVIEWS_AUTH;
  try {
    if (cfg && cfg.sessionKey) {
      sessionStorage.removeItem(cfg.sessionKey);
      localStorage.removeItem(cfg.sessionKey);
    }
  } catch (e) {}
  location.replace('/login.html');
})();
</script>
</head>
<body>
<p style="font-family:system-ui,sans-serif;padding:2rem;color:#68717e">Signing out…</p>
</body>
</html>
