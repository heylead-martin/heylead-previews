name: Deploy preview sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: roster/package-lock.json
      - name: Install pinned Roster build dependencies
        run: npm --prefix roster ci --ignore-scripts
      - name: Build parked account assets without connection settings
        run: npm --prefix roster run build:accounts
      - name: Test account and directory logic
        run: npm --prefix roster test
      - name: Stage committed sites and generated public configuration
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          cp roster/accounts.public.json _site/roster/accounts.public.json
          cp roster/assets/accounts.js _site/roster/assets/accounts.js
          cp roster/assets/accounts-licenses.txt _site/roster/assets/accounts-licenses.txt
          node roster/scripts/check-pages-artifact.mjs _site
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the complete preview site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
